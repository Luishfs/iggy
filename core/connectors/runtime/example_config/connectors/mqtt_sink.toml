type = "sink"
key = "mqtt"
enabled = true
version = 0
name = "MQTT sink"
path = "target/release/libiggy_connector_mqtt_sink"
plugin_config_format = "toml"
verbose = false

[[streams]]
stream = "example_stream"
topics = ["example_topic"]
schema = "json"
batch_length = 10
poll_interval = "5ms"
consumer_group = "mqtt_sink"

[plugin_config]
url = "172.18.0.2:1883"
client_id = "iggy_mqtt_sink"
keep_alive = 60
topic = "iggy/events"
username = "iggy"
password = "iggy_password"
reconnect = true
qos = 0
retain = false
